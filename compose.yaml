services:
  init:
    image: nousresearch/hermes-agent:latest
    user: '0:0'
    entrypoint: [python3, /bootstrap/init.py]
    environment:
      SPARK_IP: ${SPARK_IP:?Vul SPARK_IP in .env in}
      SPARK_PORT: ${SPARK_PORT:-8000}
      SPARK_API_KEY: ${SPARK_API_KEY:-}
      SPARK_MODEL: ${SPARK_MODEL:-}
      SPARK_CONTEXT: ${SPARK_CONTEXT:-}
    volumes:
      - ./init.py:/bootstrap/init.py:ro
      - hermes-data:/opt/data
      - web-config:/web-config
    restart: 'no'

  hermes:
    image: nousresearch/hermes-agent:latest
    command: [gateway, run]
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      HERMES_HOME: /opt/data
      API_SERVER_ENABLED: 'true'
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: '8642'
      API_SERVER_MODEL_NAME: hermes-agent
    volumes:
      - hermes-data:/opt/data
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8642/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    depends_on:
      hermes:
        condition: service_healthy
    ports:
      - '${WEBUI_BIND:-127.0.0.1}:${WEBUI_PORT:-3000}:8080'
    environment:
      ENABLE_OLLAMA_API: 'false'
      ENABLE_OPENAI_API: 'true'
      OPENAI_API_BASE_URL: http://hermes:8642/v1
      ENABLE_PERSISTENT_CONFIG: 'false'
      WEBUI_AUTH: 'true'
      DEFAULT_MODELS: hermes-agent
    entrypoint: [/bin/bash, -c]
    command:
      - 'export OPENAI_API_KEY="$$(cat /web-config/hermes.key)"; exec bash start.sh'
    volumes:
      - openwebui-data:/app/backend/data
      - web-config:/web-config:ro

volumes:
  hermes-data:
  openwebui-data:
  web-config:
