services:
  hermes:
    image: nousresearch/hermes-agent:latest
    command: [gateway, run]
    restart: unless-stopped
    environment:
      HERMES_HOME: /opt/data
      SPARK_IP: ${SPARK_IP:?Vul SPARK_IP in .env in}
      SPARK_PORT: ${SPARK_PORT:-8000}
      SPARK_API_KEY: ${SPARK_API_KEY:-local-no-key}
      SPARK_MODEL: ${SPARK_MODEL:?Vul SPARK_MODEL in .env in}
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      API_SERVER_MODEL_NAME: hermes-agent
      API_SERVER_KEY: ${API_SERVER_KEY:?Vul API_SERVER_KEY in .env in}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Vul TELEGRAM_BOT_TOKEN in .env in}
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS:?Vul TELEGRAM_ALLOWED_USERS in .env in}
    volumes:
      - hermes-data:/opt/data
      - ./.env:/opt/data/.env
      - ./workspace:/opt/data/workspace
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8642/health', timeout=5)"
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    depends_on:
      hermes:
        condition: service_healthy
    ports:
      - "${WEBUI_BIND:-127.0.0.1}:${WEBUI_PORT:-3000}:8080"
    environment:
      ENABLE_OLLAMA_API: "false"
      ENABLE_OPENAI_API: "true"
      ENABLE_FOLLOW_UP_GENERATION: "false"
      OPENAI_API_BASE_URLS: "http://hermes:8642/v1;http://${SPARK_IP}:${SPARK_PORT:-8000}/v1"
      OPENAI_API_KEYS: "${API_SERVER_KEY:?Vul API_SERVER_KEY in .env in};${SPARK_API_KEY:-local-no-key}"
      OPENAI_API_CONFIGS: >-
        {"0":{"enable":true,"model_ids":["hermes-agent"]},"1":{"enable":true,"model_ids":["${SPARK_MODEL}"]}}
      ENABLE_PERSISTENT_CONFIG: "false"
      WEBUI_AUTH: "true"
      DEFAULT_MODELS: hermes-agent
    volumes:
      - openwebui-data:/app/backend/data

volumes:
  hermes-data:
  openwebui-data: